[workspace]
resolver = "3"
members = [
    "crates/remanence",
    "crates/remanence-ffi",
    "crates/remanence-py",
    "xtask",
]
# **The core and the C ABI are default members now; the Python bindings
# are not** (D68, amending D52). A bare `cargo build`/`cargo test` still
# needs nothing but rustc: `remanence-ffi`'s own build (cbindgen
# regenerating `include/remanence.h`) and its in-source unit tests are
# pure Rust — cbindgen only writes the header's text, compiling nothing —
# and CMake, a C/C++ compiler and the whole C/C++ test suite moved out of
# `cargo test` entirely (D65), reached only by `task test-ffi`.
# `remanence-py`'s lifecycle depends on an external Python in a way
# `remanence-ffi`'s no longer depends on anything external at all: pyo3's
# build script resolves against a real interpreter to build against, and
# this migration never touched that.
#
# **This reintroduces the shape D52 objected to, deliberately rather than
# by accident.** D52's complaint was an *arbitrary* asymmetry —
# `remanence-ffi` was default and `remanence-py` was not, for no reason
# tied to what either crate actually cost to build. This one tracks a
# real difference instead: each crate's default membership now matches
# exactly what building and unit-testing it needs, and that need is no
# longer the same for the two. `remanence-py`'s absence stays a real gap,
# not a rule to route around — see it, and run `task test-py`. Neither
# the C/C++ suite nor the Python one is reached by default membership
# either way; both need their own `task` invocation regardless, which is
# what keeps this asymmetry smaller than the one D52 fixed.
#
# **`cargo build --workspace` and `cargo test --workspace` are still
# required checks for everything** (AGENTS.md says so), same as D52
# argued: what is optional is being the person who remembers to ask for
# them, not whether they are asked at all.
default-members = ["crates/remanence", "crates/remanence-ffi"]

[workspace.package]
version = "0.0.1-alpha.6"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ferroteca/remanence-lib"
# crates.io renders homepage and repository as separate sidebar links.
# The repository is the project's only home, so it is both rather than a
# second site that would have to be kept true.
homepage = "https://github.com/ferroteca/remanence-lib"

[workspace.dependencies]
remanence = { path = "crates/remanence", version = "0.0.1-alpha.6" }
