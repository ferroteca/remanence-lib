[workspace]
resolver = "3"
members = [
    "crates/remanence",
    "crates/remanence-ffi",
    "crates/remanence-py",
]
# Every member is a default member: `cargo test` runs the tests of all
# three application surfaces, and no surface's checks are reached only by
# a flag someone has to remember (D52).
#
# This costs a **Python interpreter to build**, PyO3's build script
# needing one — a heavier requirement than the C toolchain the C tests
# want, which is needed only to test. It used to be avoided by leaving
# remanence-py out here, at the price of S3's checks running by default
# for nobody. The surfaces are treated alike instead.
default-members = [
    "crates/remanence",
    "crates/remanence-ffi",
    "crates/remanence-py",
]

[workspace.package]
version = "0.0.1-alpha.3"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ferroteca/remanence-lib"
# crates.io renders homepage and repository as separate sidebar links.
# The repository is the project's only home, so it is both rather than a
# second site that would have to be kept true.
homepage = "https://github.com/ferroteca/remanence-lib"

[workspace.dependencies]
remanence = { path = "crates/remanence", version = "0.0.1-alpha.3" }
