[workspace]
resolver = "3"
members = [
    "crates/remanence",
    "crates/remanence-ffi",
    "crates/remanence-py",
]
# **Only the core is a default member.** A bare `cargo build` or
# `cargo test` in a clone therefore needs nothing but rustc: no CMake and
# C++ compiler for S2's callers, no Python interpreter for PyO3's build
# script, no uv or mypy for S3's suite. Someone who wants the Rust
# library alone — a distribution packager, or anyone reading the core —
# should be able to build and test it without acquiring two other
# toolchains first, and this is what gives them that.
#
# **This reverses D52 rather than restoring what came before it.** What
# D52 objected to was an asymmetry: `remanence-ffi` was in this list and
# `remanence-py` was not, so S2's checks ran by default and S3's ran for
# nobody. It removed the asymmetry by adding the Python crate; this
# removes it by naming neither. The surfaces are still treated alike.
#
# **The risk D52 named is real and unchanged**: checks reached only by a
# flag someone has to remember are checks that rot. So the answer is not
# that the bindings are optional to check — `cargo build --workspace`
# and `cargo test --workspace` are required checks, and AGENTS.md says
# so. What is optional is being the person who runs them.
default-members = ["crates/remanence"]

[workspace.package]
version = "0.0.1-alpha.4"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ferroteca/remanence-lib"
# crates.io renders homepage and repository as separate sidebar links.
# The repository is the project's only home, so it is both rather than a
# second site that would have to be kept true.
homepage = "https://github.com/ferroteca/remanence-lib"

[workspace.dependencies]
remanence = { path = "crates/remanence", version = "0.0.1-alpha.4" }
