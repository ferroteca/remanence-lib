# One toolchain for every machine that builds this tree.
#
# **rustfmt's output is not stable across releases.** Two developing
# hosts on different toolchains therefore disagree about files neither of
# them edited, which makes `cargo fmt --check` report noise and turns any
# formatting run into churn the other host wants to undo. Nothing in the
# repository can settle that argument, because both hosts are right about
# their own rustfmt; pinning removes the argument instead. rustup
# installs this toolchain on first use, wherever the tree is checked out,
# so the pin needs no cooperation beyond having rustup.
#
# The same pin makes clippy's findings and the compiler's diagnostics the
# same everywhere, which is worth as much when a lint appears on one
# machine and not the other.
#
# **This is a workspace-root file, so it does not travel in a published
# `.crate`** — cargo packages a crate directory. A distribution packager
# builds with whatever rustc they have, which is exactly what they need
# to do, and nothing here reaches them.
#
# Bumping is a deliberate act: raise the channel, run `cargo fmt`, and
# commit whatever the new rustfmt rewrites as its own change, so the
# reformatting is never mixed into a commit that means something.

[toolchain]
channel = "1.97.1"
# Named rather than left to the profile, so a host whose rustup default
# profile is `minimal` still gets the two the checks need.
components = ["rustfmt", "clippy"]
