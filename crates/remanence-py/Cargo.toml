[package]
name = "remanence-py"
description = "Python bindings for the Remanence disk image analysis library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# **PyPI is this crate's only registry.** What cargo would publish is
# source no Rust caller can use: the module is a `cdylib` with no `rlib`,
# so nothing can depend on it, and pyo3's `extension-module` leaves it
# unlinked against libpython, so nothing can build it into anything but a
# Python extension. The sdist below is the same source with the packaging
# that makes it buildable around it, which is what a source-building
# consumer actually wants. The core crate and the C ABI go to crates.io;
# this one does not.
publish = false

# The sdist carries the Python suite — a stranger who unpacks it can
# verify what they built, which is what an sdist is conventionally for.
# What stays out is the part that tests *this repository* rather than the
# package: the Rust integration tests read the crate's own sources and
# need the cargo workspace, neither of which an sdist has, and the mypy
# fixtures they drive go with them.
exclude = ["tests/*.rs", "tests/mypy_fixtures/**"]

[lib]
name = "remanence_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310", "py-clone"] }
remanence.workspace = true

# `build.rs` asks it which interpreter pyo3 resolved, so that a Python
# outside the claim is refused before anything compiles rather than at a
# consumer's `import`. It reads the config pyo3 already exported, so it
# runs no interpreter of its own and adds nothing to what a build needs.
[build-dependencies]
pyo3-build-config = "0.29"
