[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "remanence"
description = "Disk image analysis library for Remanence Workbench"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# The version is derived from the Cargo (lib) version and converted to
# PEP 440 by maturin; see AGENTS.md "Versioning and releases".
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Filesystems",
]

[tool.maturin]
module-name = "remanence"
features = ["pyo3/extension-module"]
