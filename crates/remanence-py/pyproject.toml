[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "remanence"
description = "Self-contained disk image analysis library"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# The version is derived from the Cargo (lib) version and converted to
# PEP 440 by maturin; see AGENTS.md "Versioning and releases".
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Filesystems",
]

[project.optional-dependencies]
# The sdist carries the suite so a stranger can verify what they built —
# a distro packager runs it at package-build time, on a platform and a
# Python this project never tests against.
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/ferroteca/remanence-lib"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite runs against the *installed* module, never a source tree:
# there is no importable package here to shadow it, `python/remanence`
# holding only the stub and the shim.
addopts = "-q"

[tool.maturin]
module-name = "remanence"
features = ["pyo3/extension-module"]
# A mixed layout, for the type stub alone. maturin generates the
# re-export shim for a pure-Rust project but has nowhere to put a
# `py.typed`, which PEP 561 requires to live inside the package; naming
# a python source root gives the stub and the marker a home, and
# `python/remanence/__init__.py` is the generated shim written out.
python-source = "python"
