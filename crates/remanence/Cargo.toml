[package]
name = "remanence"
description = "Self-contained disk image analysis library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Extracted and generated fixture files stay out of published
# artifacts; the globs mirror tests/fixtures/.gitignore.
exclude = [
    "tests/fixtures/HDOS_*",
    "tests/fixtures/freedos-parttest.qcow2",
    "tests/fixtures/Bill Budge Pinball Construction Set \\[Commodore 64\\] (1of2).7z",
]

[dependencies]
# Intentionally none: the library is dependency-free, including its own
# ZIP central-directory and 7z header readers and its RFC 1951 (DEFLATE)
# and LZMA/LZMA2 decompressors.
