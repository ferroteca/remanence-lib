[package]
name = "remanence"
description = "Self-contained disk image analysis library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Extracted and generated fixture files stay out of published
# artifacts; the globs mirror tests/fixtures/.gitignore.
exclude = [
    "tests/fixtures/HDOS_*",
    "tests/fixtures/freedos-parttest.qcow2",
]

[dependencies]
# Intentionally none: the library is dependency-free, including its own
# ZIP central-directory reader and RFC 1951 (DEFLATE) decompressor.
