[package]
name = "remanence"
description = "Self-contained disk image analysis library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The crates.io page renders this, and without it the page has no body
# at all. It is the crate's own README rather than the repository's: the
# root README is a whole-repo document whose relative links would all
# break off GitHub, and whose build instructions are about the cargo
# workspace rather than this crate.
readme = "README.md"
# A released artifact carries what a consumer runs and nothing else.
# maturin builds the Python sdist from cargo's package listing, so
# without this the whole integration suite ships — it did, in the
# published 0.0.1a1 and 0.0.1a2. The large downloaded HDOS, FreeDOS and
# KryoFlux fixtures no longer need excluding here: they live at
# `integration-tests/fixtures/`, outside this crate's directory
# entirely, so cargo never sees them at all.
exclude = ["tests/**"]

[features]
# Test-only, and it gates in-source `#[cfg(test)]` modules rather than any
# shipped code: `flux/c1541/renditions.rs`, `flux/drive_profile/verdict.rs`
# and `flux/remanence/reconstruction.rs` each open the KryoFlux capture
# `integration-tests/prep_fixtures.py` provides, which git does not track
# and a fresh clone does not have. Without it `cargo test` runs everything
# that builds its own images, and a clone is testable immediately.
#
# The generated `freedos-parttest.qcow2` rig has no in-source test left
# that opens it — every suite that did moved to
# `integration-tests/rust/` (D71), which declares `rigs` itself rather
# than borrowing this crate's.
fixtures = []

[dependencies]
# Intentionally none: the library is dependency-free, including its own
# ZIP central-directory and 7z header readers and its RFC 1951 (DEFLATE)
# and LZMA/LZMA2 decompressors.
