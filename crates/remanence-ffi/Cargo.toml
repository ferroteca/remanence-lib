[package]
name = "remanence-ffi"
description = "C ABI for the Remanence disk image analysis library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# As in the core crate: the registry page needs a body, and this crate's
# own README is the one whose links survive off GitHub. It addresses the
# C and C++ consumer, who is not the reader either other README has.
readme = "README.md"
# As in the core crate: a released artifact carries what a consumer runs
# and nothing else. `c/{include,examples,tests}` groups everything the
# C/C++-facing surface owns, apart from this crate's own Rust scaffolding
# — but only `c/tests/` is excluded here. What lives under it tests
# *this repository* — that the header stands alone, that the C++
# wrapper's claims hold — and it needs CMake, a C and C++ compiler, and a
# cargo workspace two directories up to build the leak probe in. A
# consumer extracting the crate has none of those and is not changing
# what they check, so `cargo test` on the published crate runs the unit
# tests and succeeds. `c/include/` and `c/examples/` deliberately stay:
# the header is what a consumer builds against, and `identify.c`/
# `identify.cpp` are the best documentation a C caller gets — cargo ships
# both as plain files rather than as targets it builds. `c/tests/` is
# named `tests`, unlike this crate's own (Rust-only) `tests/`, because
# `cargo test` never looks inside `c/` at all; `task test-ffi` does.
#
# Stated as `include` rather than `exclude` because `remanence.h` is
# generated output the repository does not track (`.gitignore` names it),
# and cargo honours the ignore rules when it packages by exclusion —
# the header would silently drop out of the release. An `include` list
# is what cargo ships regardless of ignore rules; Cargo.toml, the README
# and the licence files ship whether listed or not.
include = [
    "src/**",
    "build.rs",
    "cbindgen.toml",
    "c/include/**",
    "c/examples/**",
]

[lib]
name = "remanence_ffi"
crate-type = ["staticlib", "cdylib"]

[features]
# Counts live Rust allocations inside the cdylib and exports the count,
# so a C caller can assert that a handle's `_free` gives back everything
# its creation took. Test-only and off by default: a released artifact
# carries neither the counter nor the symbol. Built by `xtask`, which
# `task test-ffi` drives.
leak-probe = []

[dependencies]
remanence.workspace = true

[build-dependencies]
cbindgen = "0.29"
