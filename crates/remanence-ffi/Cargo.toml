[package]
name = "remanence-ffi"
description = "C ABI for the Remanence disk image analysis library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# As in the core crate: the registry page needs a body, and this crate's
# own README is the one whose links survive off GitHub. It addresses the
# C and C++ consumer, who is not the reader either other README has.
readme = "README.md"
# As in the core crate: a released artifact carries what a consumer runs
# and nothing else. What lives under `tests/` here tests *this
# repository* — that the header stands alone, that the C++ wrapper's
# claims hold — and it needs CMake, a C and C++ compiler, and a cargo
# workspace two directories up to build the leak probe in. A consumer
# extracting the crate has none of those and is not changing what they
# check, so `cargo test` on the published crate runs the unit tests and
# succeeds. `examples/` deliberately stays: `identify.c` and
# `identify.cpp` are the best documentation a C caller gets, and cargo
# ships them as plain files rather than as targets it builds.
exclude = ["tests/**"]

[lib]
name = "remanence_ffi"
crate-type = ["staticlib", "cdylib"]

[features]
# Counts live Rust allocations inside the cdylib and exports the count,
# so a C caller can assert that a handle's `_free` gives back everything
# its creation took (D46). Test-only and off by default: a released
# artifact carries neither the counter nor the symbol. Built by `xtask`
# (D65), which `just test-ffi` drives.
leak-probe = []

[dependencies]
remanence.workspace = true

[build-dependencies]
cbindgen = "0.29"
