header = """/*
 * SPDX-FileCopyrightText: 2026 Paul Galbraith
 * SPDX-License-Identifier: GPL-3.0-only
 */"""
language = "C"
cpp_compat = true
include_guard = "REMANENCE_H"
autogen_warning = "/* Generated by cbindgen from crates/remanence-ffi. Do not edit by hand. */"
documentation = true
documentation_style = "c99"
style = "type"
usize_is_size_t = true

[export]
# The leak probe is test-only and lives behind the `leak-probe` feature.
# It is not part of S2, so it never reaches the header however the crate
# is built; a C caller that wants it declares it itself.
exclude = ["remanence_probe_live_allocations"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[fn]
sort_by = "None"
