version = 1
SPDX-PackageName = "remanence-lib"
SPDX-PackageSupplier = "Paul Galbraith <paul@galbraiths.ca>"

# Files that cannot (or should not) carry comment headers.
[[annotations]]
path = [
    ".gitignore",
    "README.md",
    # Each distributable crate carries its own README, because it is what
    # the registry page renders and the root README's relative links do
    # not survive off GitHub.
    "crates/remanence/README.md",
    "crates/remanence-ffi/README.md",
    "crates/remanence-py/README.md",
    "AGENTS.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "TRADEMARKS.md",
    "ARCHITECTURE.md",
    "USE-CASES.md",
    "REUSE.toml",
    "planning/**",
    "Cargo.toml",
    "Cargo.lock",
    "crates/remanence/Cargo.toml",
    "crates/remanence-ffi/Cargo.toml",
    "crates/remanence-ffi/cbindgen.toml",
    "crates/remanence-py/Cargo.toml",
    "crates/remanence-py/pyproject.toml",
    "integration-tests/rust/Cargo.toml",
    "xtask/Cargo.toml",
    # PEP 561 requires this marker to be empty; a comment header would
    # not make it invalid, but the file's whole content is its absence.
    "crates/remanence-py/python/src/remanence/py.typed",
    # The rig assets. `prep_fixtures.py` (now under integration-tests/)
    # and the rig blueprint carry their own headers; these are the files
    # where one would be rewritten by the tool that owns them, or is not
    # the project's to put there.
    "test-fixture-prep/test-rigs/.gitignore",
    "test-fixture-prep/test-rigs/README.md",
    # The ignore lists themselves, not the material they name — see
    # below. Both directories are written by the prep script and hold
    # nothing tracked but these two files.
    "integration-tests/fixtures/.gitignore",
    "integration-tests/downloads/.gitignore",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paul Galbraith"
SPDX-License-Identifier = "GPL-3.0-only"

# integration-tests/fixtures/ and integration-tests/downloads/ are
# deliberately NOT annotated: the HDOS disk images under fixtures/, and
# the archive under downloads/ a fixture is repackaged out of, are
# vintage third-party distribution media the project claims no copyright
# in. Their status is an open question in planning/DECISIONS.md, to be
# resolved before any package publish. Each directory's own `.gitignore`
# is listed above as an exact path, never as a glob over the directory,
# so that omission stays deliberate. integration-tests/rust/ is a
# project-authored crate, not fixture material, and its files carry
# ordinary headers (or the Cargo.toml annotation above) like any other
# source in the workspace.
