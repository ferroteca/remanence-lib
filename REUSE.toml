version = 1
SPDX-PackageName = "remanence-lib"
SPDX-PackageSupplier = "Paul Galbraith <paul@galbraiths.ca>"

# Files that cannot (or should not) carry comment headers.
[[annotations]]
path = [
    ".gitignore",
    "README.md",
    # Each distributable crate carries its own README, because it is what
    # the registry page renders and the root README's relative links do
    # not survive off GitHub.
    "crates/remanence/README.md",
    "crates/remanence-ffi/README.md",
    "crates/remanence-py/README.md",
    "AGENTS.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "TRADEMARKS.md",
    "ARCHITECTURE.md",
    "REUSE.toml",
    "planning/**",
    "Cargo.toml",
    "Cargo.lock",
    "crates/remanence/Cargo.toml",
    "crates/remanence-ffi/Cargo.toml",
    "crates/remanence-ffi/cbindgen.toml",
    "crates/remanence-py/Cargo.toml",
    "crates/remanence-py/pyproject.toml",
    # PEP 561 requires this marker to be empty; a comment header would
    # not make it invalid, but the file's whole content is its absence.
    "crates/remanence-py/python/remanence/py.typed",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paul Galbraith"
SPDX-License-Identifier = "GPL-3.0-only"

# crates/remanence/tests/fixtures/ is deliberately NOT annotated: the HDOS
# disk images there are vintage third-party distribution media the project
# claims no copyright in. Their status is an open question in
# planning/DECISIONS.md, to be resolved before any package publish.
