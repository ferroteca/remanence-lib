#
# The tasks live in integration-tests/Taskfile.yml, beside the fixtures
# and suites they drive; this file includes them flattened, so `task
# test-rust`, `task integration-test`, `task clean` and the rest run under
# their plain names from the repository root. `dir` keeps their working
# directory at integration-tests/ whichever Taskfile was found.

version: '3'

includes:
  integration-tests:
    taskfile: integration-tests/Taskfile.yml
    dir: integration-tests
    flatten: true
