[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
publish = false

# Only to read cargo's own `--message-format=json` report of what it just
# built: the C tests link a file whose name and directory are the
# toolchain's to choose, and asking is exact where searching a directory
# for a plausible name is right only on the host it was written on.
[dependencies]
serde_json = "1"
